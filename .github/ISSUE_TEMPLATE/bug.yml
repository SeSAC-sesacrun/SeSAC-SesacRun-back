name: "🐞 Bug"
description: "버그 리포트"
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: ❗ 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
      placeholder: 에러 상황을 자세히 남길수록 좋습니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔄 재현 방법
      description: 버그를 재현할 수 있는 방법을 작성해주세요.
      placeholder: "1. ~로 이동\n2. ~를 클릭\n3. 오류 발생"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📸 스크린샷 / 로그
      description: 에러 로그 또는 캡처가 있다면 첨부해주세요.

  - type: textarea
    attributes:
      label: 🛠 예상 원인
      description: 예상되는 원인이 있다면 작성해주세요.
