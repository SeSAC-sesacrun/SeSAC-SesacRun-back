name: "🛠 Refactor"
description: "코드 리팩토링 작업"
labels: ["refactor"]
body:
  - type: textarea
    attributes:
      label: ✏️ 리팩토링 설명
      description: 어떤 부분을 리팩토링하려는지 작성해주세요.
      placeholder: 리팩토링 이유 및 개선 목표를 적어주세요.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 📌 작업 상세 내용
      placeholder: "- [ ] 불필요한 코드 제거\n- [ ] 네이밍 개선"
    validations:
      required: true
